<header class="site-header" role="banner">
  <div class="wrapper header-wrapper-custom">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      {{ site.title | escape }}
    </a>

    <nav class="kapitel-nav">
      <details class="kapitel-details">
        <summary>Kapitel</summary>

        <div class="kapitel-menu">
          {%- for path in site.header_pages -%}
            {%- assign my_page = site.pages | where: "path", path | first -%}
            {%- if my_page.title -%}
              <a href="{{ my_page.url | relative_url }}">
                {{ my_page.title | escape }}
              </a>
            {%- endif -%}
          {%- endfor -%}
        </div>
      </details>
    </nav>
  </div>
</header>
